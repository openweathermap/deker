name: test-build

on:
  push:
    tags-ignore:
      - 'v[1-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Build the test distributions
    uses: openweathermap/deker-actions/.github/workflows/build.yml@feature/v2.0.0

  upload_test_pypi:
    name: Upload the test distributions
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ vars.PACKAGE_NAME }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks default artifact into dist/
          # if `name: artifact` is omitted, the action will create extra parent dir
          name: artifact
          path: dist

      - name: Publish the test distributions to Test-PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
