name: build

on:
  push:
    tags:
      - 'v[1-9]+.[0-9]+.[0-9]+'

jobs:
  tests:
    uses: openweathermap/deker-actions/.github/workflows/tox.yml@feature/v2.0.0
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      siblings: '["deker-local-adapters", "deker-server-adapters", "deker-tools"]'
    secrets: inherit

  build_docs:
    needs: tests
    uses: openweathermap/deker-actions/.github/workflows/docs_build.yml@feature/v2.0.0
    with:
      python-version: '3.10'
      version: ${{ github.ref_name }}
      siblings: '["deker-local-adapters", "deker-server-adapters", "deker-tools"]'

  build:
    needs: [tests, build_docs]
    name: Build the distributions
    uses: openweathermap/deker-actions/.github/workflows/build.yml@feature/v2.0.0

  publish_docs:
    needs: [build_docs, build]
    uses: openweathermap/deker-actions/.github/workflows/docs_publish.yml@feature/v2.0.0
    permissions:
      contents: write
    with:
      version: ${{ github.ref_name }}

  upload_pypi:
    name: Publish the distributions
    needs: [build_docs, build]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/${{ vars.PACKAGE_NAME }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks default artifact into dist/
          # if `name: artifact` is omitted, the action will create extra parent dir
          name: artifact
          path: dist

      - name: Publish the distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
