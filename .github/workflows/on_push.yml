name: push

on:
  push:
    branches-ignore:
      - 'refs/tags/v'

jobs:
  tests:
    uses: openweathermap/deker-actions/.github/workflows/tox.yml@feature/v2.0.0
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      numpy-floors: '[{"python": "3.10", "numpy": "1.26.4"}, {"python": "3.11", "numpy": "1.26.4"}, {"python": "3.12", "numpy": "1.26.4"}, {"python": "3.13", "numpy": "2.1.0"}, {"python": "3.14", "numpy": "2.3.2"}]'
      siblings: '["deker-local-adapters", "deker-server-adapters", "deker-shell", "deker-tools"]'
    secrets: inherit
