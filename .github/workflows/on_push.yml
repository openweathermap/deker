name: push

on:
  push:
    branches-ignore:
      - 'refs/tags/v'

jobs:
  tox_tests:
    uses: openweathermap/deker-actions/.github/workflows/tox.yml@feature/python-versions-input
    with:
      package-name: ${{ vars.PACKAGE_NAME }}
      min-coverage: 96
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
