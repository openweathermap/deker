# https://pre-commit.com/

default_stages: [ pre-commit, pre-push ]
# No default_language_version: hooks run on the interpreter pre-commit itself runs under (the project .venv).
# The target Python version is fixed in the tools' own configs (py310), not by the interpreter.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # Possible releases: https://github.com/pre-commit/pre-commit-hooks/releases
    hooks:
      - id: no-commit-to-branch
        always_run: true

      - id: check-ast
        always_run: true

      - id: check-json
        always_run: true

      - id: pretty-format-json
        always_run: true
        args: [ --autofix, --indent=4 ]

      - id: check-toml
        always_run: true

      - id: check-yaml
        always_run: true

      - id: check-xml
        always_run: true

      - id: end-of-file-fixer
        always_run: true

      - id: check-docstring-first
        always_run: true

      - id: trailing-whitespace
        exclude: .md$
        always_run: true

      - id: check-added-large-files
        exclude: ^uv\.lock$  # the lock file is generated and legitimately large
        always_run: true

      - id: detect-private-key
        always_run: true

      - id: detect-aws-credentials
        always_run: false
        args: [ --allow-missing-credentials ]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.8  # Possible releases: https://github.com/astral-sh/uv-pre-commit/releases
    hooks:
      - id: uv-lock
        name: uv-lock (keep uv.lock in sync with pyproject.toml)
        stages:
          - pre-commit

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0  # Possible releases: https://github.com/asottile/pyupgrade/releases
    hooks:
      - id: pyupgrade
        args: [ --py310-plus ]
        stages:
          - pre-commit

  - repo: https://github.com/bwhmather/ssort
    rev: 0.19.0  # Possible releases: https://github.com/bwhmather/ssort/releases
    hooks:
      - id: ssort
        entry: ssort
        files: ^deker/
        always_run: false
        stages:
          - pre-commit

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # Possible releases: https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      - id: ruff-check
        name: ruff (lint, replaces flake8 + isort + pycln)
        args: [ --fix ]
        stages:
          - pre-commit

      - id: ruff-format
        name: ruff (format, replaces black)
        stages:
          - pre-commit

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1  # Possible releases: https://github.com/python/mypy/tags
    hooks:
      - id: mypy
        name: mypy
        files: ^deker/
        always_run: false
        args: [
          --install-types,
          --non-interactive,
          --config-file=pyproject.toml
        ]
        # The hook runs in its own environment: the typed runtime dependencies must be there,
        # otherwise attrs classes have no constructors for mypy and numpy is untyped
        additional_dependencies:
          - "attrs>=23.1.0,<27"
          - "numpy>=1.26,<3"
          - "deker-tools>=1.2.0,<2"
        stages:
          - pre-commit

  - repo: https://github.com/jsh9/pydoclint
    rev: 0.12.0  # Possible releases: https://github.com/jsh9/pydoclint/releases
    hooks:
      - id: pydoclint
        name: pydoclint (docstrings vs signatures, replaces darglint)
        files: ^deker/
        args: [ --config=pyproject.toml ]
        stages:
          - pre-commit

  - repo: https://github.com/PyCQA/doc8
    rev: v2.0.0  # Possible releases: https://github.com/PyCQA/doc8/releases
    hooks:
      - id: doc8
        name: doc8 (RST linter)
        args: [ --config=pyproject.toml, docs/deker ]
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2  # Possible releases: https://github.com/crate-ci/typos/releases
    hooks:
      - id: typos
        name: typos
        files: ^deker/
        stages:
          - pre-commit

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        files: ^tests/
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
